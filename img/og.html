<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>Coastory social preview</title>
<style>
@font-face { font-family: Nunito; src: url('/fonts/nunito.woff2'); font-weight: 200 900; }
@font-face { font-family: Fraunces; src: url('/fonts/fraunces.woff2'); font-weight: 100 900; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { position: relative; background: radial-gradient(ellipse at 82% 100%, #123747, transparent 48%), radial-gradient(ellipse at 100% 20%, #291529, transparent 50%), #100b25; color: #fff7f0; font-family: Nunito, sans-serif; }
main { padding: 72px; }
.brand { margin: 0 0 25px; color: #ff765b; font-size: 46px; font-weight: 800; }
h1 { margin: 0; font-family: Fraunces, serif; font-size: 58px; line-height: 1.2; font-weight: 700; letter-spacing: -1px; }
.description { margin: 27px 0 0; font-size: 28px; color: #c9c2d8; }
.rules { margin: 3px 0 0; font-size: 26px; color: #52c4d0; font-weight: 800; }
.beta { position: absolute; left: 72px; bottom: 54px; margin: 0; padding: 10px 20px; border: 1px solid #80584e; border-radius: 30px; background: #30212b; font-size: 25px; font-weight: 800; }
.phone { position: absolute; top: 40px; right: 72px; width: 254px; height: 550px; object-fit: contain; border-radius: 36px; box-shadow: 0 18px 45px #0006; }
</style>
</head>
<body>
<main>
  <p class="brand">Coastory</p>
  <h1>Your credits.<br>Your rules.<br>Your story.</h1>
  <p class="description">A roller coaster tracking app for enthusiasts.</p>
  <p class="rules">You decide what counts.</p>
  <p class="beta">Android open beta &middot; iPhone TestFlight</p>
  <img class="phone" src="/img/profile.webp" alt="Coastory rider profile with 197 credits across 19 parks in 14 countries.">
</main>
</body>
</html>
