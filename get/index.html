<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Get Coastory — Every coaster has a story.</title>
<meta name="description" content="A roller coaster tracker that counts your way. Download Coastory for iPhone or Android. Track your credits, rank your favorite rides, and remember every adventure.">
<link rel="canonical" href="https://coastory.app/get">
<meta name="theme-color" content="#fff7f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#100b25" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Coastory">
<meta property="og:url" content="https://coastory.app/get">
<meta property="og:title" content="Get Coastory — Every coaster has a story.">
<meta property="og:description" content="Track your credits, your way. Rank your favorite rides. Remember every adventure. Free on iPhone and Android where available.">
<meta property="og:image" content="https://coastory.app/img/og-launch-2026-11-10.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Coastory: your credits, your rules, your story. A real app preview of a rider’s coaster history.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="preload" href="/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">

<script src="/get/device.js" defer></script>

<body class="get-page">
<main class="get-main">
  <div class="get-copy">
    <div class="get-brand"><img src="/icon.png" alt="" width="72" height="72"><span>Coastory</span></div>
    <h1>Every coaster<br>has a story.</h1>
    <p class="get-intro">Track your credits, your way.<br>Rank your favorite rides.<br>Remember every adventure.</p>
    <p class="get-reassurance">Free. No ads. No account required.</p>
    <div class="get-stores" aria-label="Download Coastory">
      <a id="app-store" class="get-store" href="https://apps.apple.com/app/id6803185657" aria-describedby="availability">
        <img src="/assets/badges/app-store.svg" alt="Download on the App Store" width="144" height="48">
      </a>
      <a id="google-play" class="get-store" href="https://play.google.com/store/apps/details?id=com.velocicoder.coastory" aria-describedby="availability">
        <img src="/assets/badges/google-play.svg" alt="Get it on Google Play" width="162" height="48">
      </a>
    </div>
    <p id="availability" class="get-availability">For iPhone and Android. Availability varies by region.</p>
  </div>
  <figure class="get-preview">
    <picture>
      <source media="(prefers-color-scheme: light)" srcset="/img/profile-2026-10-29-light.jpg" width="660" height="1434">
      <img src="/img/profile-2026-10-29.jpg" alt="Coastory’s My Story screen: a rider’s coaster photo, personal credit count, parks visited, and chosen favorite rides." width="660" height="1434" decoding="async">
    </picture>
    <figcaption>Your rides. Your memories. Your story.</figcaption>
  </figure>
</main>
<footer class="get-footer">
  <a href="/">About Coastory</a>
  <a href="/privacy/">Privacy</a>
  <a href="/support/">Support</a>
</footer>
